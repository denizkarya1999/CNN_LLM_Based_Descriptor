name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb xauth
          python -m pip install 'Pillow>=10.4,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
      - name: Check Python and launcher syntax
        run: |
          python -m compileall -q cnn_llm_based_descriptor main.py launcher.py setup_descriptor.py
          bash -n Run_CNN_LLM_Based_Descriptor.sh
      - name: Check launcher layout and grounded decisions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python - <<'PY'
          import json, tempfile, time, tkinter as tk
          from unittest.mock import patch
          from launcher import SetupWindow
          from cnn_llm_based_descriptor.app import App
          from cnn_llm_based_descriptor.config import RunConfig
          from cnn_llm_based_descriptor.algorithms.shared.evidence import detection_evidence
          from cnn_llm_based_descriptor.algorithms.shared.grounding import action_choices, parse_choice, render_description
          def settle(root):
              for _ in range(10):
                  root.update()
                  time.sleep(.03)
          def visible(widget, root):
              assert widget.winfo_ismapped()
              assert widget.winfo_rooty() >= root.winfo_rooty()
              assert widget.winfo_rootx() >= root.winfo_rootx()
              assert widget.winfo_rootx()+widget.winfo_width() <= root.winfo_rootx()+root.winfo_width()+1
              assert widget.winfo_rooty()+widget.winfo_height() <= root.winfo_rooty()+root.winfo_height()+1
          with tempfile.TemporaryDirectory() as project, patch.object(SetupWindow, 'check'):
              root=tk.Tk(); launcher=SetupWindow(root, project=project)
              for size in ('800x740', '640x480'):
                  root.geometry(size); settle(root)
                  for widget in (launcher.open_button,launcher.check_button,launcher.install_button,launcher.system_button,launcher.cancel_button):
                      visible(widget, root)
              launcher._destroy()
          records=[{'name':'person','confidence':.91,'box':{'x1':0,'y1':0,'x2':30,'y2':70}}]
          evidence,total=detection_evidence(records,100,80,10)
          with patch.object(App,'refresh_devices'), patch.object(App,'refresh_cameras'):
              root=tk.Tk(); app=App(root)
              for size in ('1440x900','760x520'):
                  root.geometry(size)
                  for step in ('give_space:d1','no_action'):
                      choice=parse_choice(json.dumps({'environment':'indoor','setting':'home','next_step':step}), action_choices(evidence))
                      packet=render_description(evidence,total,100,80,RunConfig(),choice=choice)
                      packet.update(type='description',frame=1,source_seconds=None,elapsed_seconds=1)
                      app._handle(packet); settle(root)
                      for widget in (app.start_button,app.stop_button,app.record_button,app.snapshot_button,app.settings_button,app.details_button,app.outputs_button,app.canvas,app.description_body):
                          visible(widget,root)
                      assert app.canvas.winfo_height() >= 60
                      assert app.description_body.winfo_height() >= 50
                      assert bool(app.description_body.tag_ranges('take_action')) == (step!='no_action')
                      assert bool(app.description_body.tag_ranges('no_action')) == (step=='no_action')
                      assert 'Description (LLM):' in packet['text'] and '91%' in packet['text']
              app._destroy()
          try:
              parse_choice('{"environment":"indoor","setting":"home","next_step":"inspect:d99"}',action_choices(evidence))
              raise AssertionError('Unknown object was accepted')
          except ValueError:
              pass
          from dataclasses import replace
          from pathlib import Path
          import itertools, math, queue, random, threading
          import numpy as np
          from cnn_llm_based_descriptor.config import RunConfig
          from cnn_llm_based_descriptor.algorithms.shared.knowledge import load_scene_model
          from cnn_llm_based_descriptor.algorithms.probability.inference import infer_setting
          from cnn_llm_based_descriptor.algorithms.shared.review_policy import assess_detections
          from cnn_llm_based_descriptor.algorithms.search.targets import review_targets,search_review_plan
          from cnn_llm_based_descriptor.algorithms.shared.evidence import detection_evidence
          from cnn_llm_based_descriptor.descriptor import FrameDescriber
          from cnn_llm_based_descriptor.algorithms.llm.client import OllamaVisionClient
          from cnn_llm_based_descriptor.algorithms.factory import create_descriptor_client
          from cnn_llm_based_descriptor.algorithms.shared.grounding import action_choices,parse_choice
          from cnn_llm_based_descriptor.methods import SEARCH_ALGORITHMS,DESCRIBE_BACKENDS,latency_text
          from cnn_llm_based_descriptor.algorithms.search.planner import search_batch
          from cnn_llm_based_descriptor.algorithms.search.state import heuristic
          # Moving algorithm modules must not move stored model paths or break imports.
          import importlib, pkgutil
          import cnn_llm_based_descriptor.algorithms as algorithms
          from cnn_llm_based_descriptor.paths import PROJECT_ROOT
          from cnn_llm_based_descriptor.algorithms.llm.model_store import MODEL_DIRECTORY
          assert PROJECT_ROOT == Path.cwd().resolve()
          assert MODEL_DIRECTORY == PROJECT_ROOT / 'Models' / 'ollama'
          assert RunConfig().weights.parent == PROJECT_ROOT / 'Models'
          for module in pkgutil.walk_packages(algorithms.__path__, algorithms.__name__ + '.'):
              importlib.import_module(module.name)
          model=load_scene_model();frame=np.zeros((100,100,3),dtype=np.uint8)
          def record(label,score=.9,x=10,y=10):return {'name':label,'confidence':score,'box':{'x1':x,'y1':y,'x2':x+10,'y2':y+10}}
          def facts(records):return detection_evidence(records,100,100,None,require_boxes=True)[0]
          assert len(model['labels'])==80
          assert all(set(row['likelihoods'])==set(model['labels']) for row in model['scenes'].values())
          # Every default label and a custom label reaches both the scene and decision stages.
          records=[record(label) for label in model['labels']]+[record('custom gauge')]
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=AssertionError('Unexpected LLM request')):
              for backend in ("Search Algorithm", "Probability Algorithm"):
                  cfg=RunConfig(describe_backend=backend,describe_max_objects=1,describe_url='invalid')
                  cfg.validate_descriptor();packet=create_descriptor_client(cfg).describe(frame,records)
                  assert len(packet['evidence'])==81 and packet['detections_considered']==81
                  assert packet['descriptor_type']==backend
                  scene=packet.get('scene_inference')
                  decision=packet.get('decision_inference',packet.get('decision_search'))
                  assert len(decision['assessments'])==81
                  if scene:
                      assert len(scene['observed_labels'])==81 and scene['custom_labels']==['custom gauge']
                  else:
                      assert 'Environment' not in packet['text'] and packet['setting'] is None
                  for labels in [('laptop','keyboard','mouse'),('couch','tv','remote')]:
                      p=create_descriptor_client(cfg).describe(frame,[record(l) for l in labels]);assert p['setting'] in ({'home','office'} if scene else {None}),p
                  assert create_descriptor_client(cfg).describe(frame,[])['grounding_status']=='no_detections'
                  assert create_descriptor_client(replace(cfg,task='Image classification')).describe(frame,[{'name':'cat','confidence':.9}])['grounding_status']=='classification'
          # Independent Bayes arithmetic and neutral custom observations.
          base=infer_setting(facts([record('laptop')]),model)
          weights={key:row['prior']*row['likelihoods']['laptop'] for key,row in model['scenes'].items()}
          assert all(math.isclose(base['posterior'][k],v/sum(weights.values())) for k,v in weights.items())
          assert infer_setting(facts([record('laptop'),record('laptop',.6)]),model)['posterior']==base['posterior']
          custom=infer_setting(facts([record('laptop'),record('custom gauge')]),model)
          assert all(math.isclose(base['posterior'][k],custom['posterior'][k]) for k in weights)
          low=infer_setting(facts([record('laptop',.4)]),model)
          assert 'laptop' in low['observed_labels'] and low['posterior']!=base['posterior'] and low['setting']=='unclear'
          # All search algorithms reach the same full goal, and UCS/A* match brute force.
          random.seed(11)
          for _ in range(6):
              evidence=facts([record('knife',x=random.randrange(90),y=random.randrange(90)),record('traffic light',x=random.randrange(90),y=random.randrange(90)),record('custom gauge',.4,x=random.randrange(90),y=random.randrange(90))])
              targets=review_targets(evidence,assess_detections(evidence,model))
              optimum=math.inf
              for order in itertools.permutations(targets):
                  for choices in itertools.product(*(t['options'] for t in order)):
                      center=(.5,.5);cost=0
                      for target,(_,effort) in zip(order,choices):
                          cost+=effort+sum(abs(a-b) for a,b in zip(center,target['center']));center=target['center']
                      optimum=min(optimum,cost)
              assert heuristic(targets,0,(.5,.5))<=optimum+1e-9
              for algorithm in SEARCH_ALGORITHMS:
                  plan=search_review_plan(evidence,algorithm,model)
                  assert plan['algorithm']==algorithm and len(plan['steps'])==3
                  assert {s['detection_id'] for s in plan['steps']}=={i['id'] for i in evidence}
                  assert all(s['choice'] in action_choices(evidence) for s in plan['steps'])
                  assert math.isclose(sum(s['cost'] for s in plan['steps']),plan['cost'])
                  if algorithm in (SEARCH_ALGORITHMS[3],SEARCH_ALGORITHMS[5]):
                      assert math.isclose(plan['cost'],optimum),(algorithm,plan['cost'],optimum)
                      assert plan['globally_cost_optimal']
          # More than both old caps; every target is planned, including last/lowest-score.
          for algorithm in SEARCH_ALGORITHMS:
              packet=create_descriptor_client(RunConfig(describe_backend='Search Algorithm',describe_search=algorithm,describe_max_objects=1)).describe(frame,[record('custom gauge',.4,x=i%90) for i in range(17)])
              plan=packet['decision_search']
              assert len(plan['steps'])==17 and plan['omitted_targets']==0 and len(plan['batches'])==4
              assert len({s['detection_id'] for s in plan['steps']})==17
              assert not plan['globally_cost_optimal']
          # Precise latency and method identity go through the real async/save path.
          with tempfile.TemporaryDirectory() as directory:
              stop=threading.Event();switch=threading.Event();switch.set();messages=queue.Queue()
              cfg=RunConfig(describe_backend='Probability Algorithm')
              worker=FrameDescriber(cfg,messages,stop,switch)
              worker.submit(frame,[record('traffic light')],4,None,time.monotonic(),directory)
              packet=messages.get(timeout=5);worker.close()
              saved=json.loads((Path(directory)/'descriptions.jsonl').read_text())
              assert saved['descriptor_type']=='Probability Algorithm' and saved['algorithm']=='Inference by Enumeration'
              assert saved['inference_latency_ms']>0
              assert math.isclose(saved['inference_latency_ms'],saved['elapsed_seconds']*1000)
              assert saved['decision_inference']['next_step']=='check_signal:d1'
          assert '0.37 ms' in latency_text(.371) and '1.234 s' in latency_text(1234)
          print('All 80 labels + custom labels, all six searches, exact costs, probability math, no truncation, routing and saved latency passed.')
          # Model validation continues to reject unsupported place claims and extra objects.
          for raw in ['{"environment":"outdoor","setting":"ballroom","next_step":"no_action"}',
                      '{"environment":"indoor","setting":"invented place","next_step":"no_action"}',
                      '{"environment":"indoor","setting":"home","next_step":"no_action","objects":["invented"]}']:
              try:
                  parse_choice(raw, action_choices(evidence))
                  raise AssertionError('Invalid setting accepted')
              except ValueError:
                  pass
          llm=OllamaVisionClient(RunConfig());llm.checked=True
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=[{'message':{'content':'{"environment":"indoor","setting":"ballroom","next_step":"no_action"}'}}, {'response':'{"reason":"[d1] establishes presence in the estimated setting without a specific reason to intervene."}'}]):
              packet=llm.describe(frame,[record('person')])
              assert 'ballroom or event hall' in packet['text'] and packet['algorithm']=='qwen3-vl:2b'
          # Every named method and precise latency stays visible in the descriptor.
          with patch.object(App,'refresh_devices'), patch.object(App,'refresh_cameras'):
              root=tk.Tk(); app=App(root)
              configurations=[RunConfig(describe_backend='Search Algorithm',describe_search=a) for a in SEARCH_ALGORITHMS]
              configurations.append(RunConfig(describe_backend='Probability Algorithm'))
              configurations.append(RunConfig(describe_backend='General Algorithmic Approach'))
              for size in ('1440x900','760x520'):
                  root.geometry(size)
                  for cfg in configurations:
                      packet=create_descriptor_client(cfg).describe(frame,[record('traffic light')])
                      packet.update(type='description',frame=1,source_seconds=None,elapsed_seconds=.000371,inference_latency_ms=.371)
                      app._handle(packet);settle(root)
                      assert cfg.describe_backend in app.description_title.get()
                      assert packet['algorithm'] in app.description_title.get()
                      assert '0.37 ms' in app.description_latency.get()
                      assert app.description_body.tag_cget('take_action','foreground')=='#ff6b78'
                      assert app.description_body.tag_cget('no_action','foreground')=='#65e08c'
                      for widget in (app.canvas,app.description_body,app.start_button,app.settings_button):visible(widget,root)
                      assert app.description_body.winfo_height()>=50, (size,cfg.describe_search,app.description_body.winfo_height())
              app.show_settings();window=app.settings_window;window.geometry('640x480')
              from tkinter import ttk
              notebook=next(w for w in window.winfo_children() if isinstance(w,ttk.Notebook));notebook.select(3);settle(root)
              def descendants(widget):
                  for child in widget.winfo_children():
                      yield child
                      yield from descendants(child)
              category=next(w for w in descendants(window) if isinstance(w,ttk.Combobox) and w.cget('textvariable')==str(app.vars['describe_backend']))
              for backend in DESCRIBE_BACKENDS:
                  category.set(backend);category.event_generate('<<ComboboxSelected>>');settle(root)
                  assert app.vars['describe_backend'].get()==backend
                  if backend=='Search Algorithm':
                      assert tuple(app.description_algorithm_combo['values'])==SEARCH_ALGORITHMS
                      app.description_algorithm_combo.set('A* Search')
                      app.description_algorithm_combo.event_generate('<<ComboboxSelected>>')
                      assert app.vars['describe_search'].get()=='A* Search'
                  elif backend=='Probability Algorithm':
                      assert app.description_algorithm_combo.get()=='Inference by Enumeration'
                  elif backend=='General Algorithmic Approach':
                      assert app.description_algorithm_combo.get()=='Priority-Based Robot Action Plans'
                  else:
                      assert app.description_algorithm_combo.get()==app.vars['describe_model'].get()
              with tempfile.TemporaryDirectory() as d:
                  app.settings_path=Path(d)/'settings.json'
                  app.settings_path.write_text('{"describe_backend":"CIS 579"}')
                  assert app._load_settings().describe_backend=='Search Algorithm'
                  app.selected_device.set('CPU');app.vars['describe_backend'].set('Search Algorithm')
                  app._save_settings(app._config())
                  assert app._load_settings().describe_search=='A* Search'
                  app.vars['describe_backend'].set('General Algorithmic Approach')
                  app._save_settings(app._config())
                  assert app._load_settings().describe_backend=='General Algorithmic Approach'
              window.destroy();app._destroy()
          from cnn_llm_based_descriptor.comparison import expected_matches, export_results, run_comparison
          from cnn_llm_based_descriptor.measurement import measure_description
          records=[record('traffic light'),record('knife',.8,40),record('custom gauge',.4,70)]
          for algorithm in SEARCH_ALGORITHMS:
              packet=measure_description(create_descriptor_client(RunConfig(describe_backend='Search Algorithm',describe_search=algorithm)),frame,records)
              plan=packet['decision_search']
              assert 'Environment' not in packet['text'] and packet['setting'] is None
              assert len(plan['traversal'])==plan['expanded_states'] and plan['traversal'][-1]['goal']
              assert plan['generated_states']>=plan['expanded_states'] and plan['peak_frontier']>0
              assert 'traffic light [d1]' in packet['text']
          packet=create_descriptor_client(RunConfig(describe_backend='Probability Algorithm')).describe(frame,records)
          scene=packet['scene_inference']
          for name,joint in scene['log_joint'].items():
              assert math.isclose(math.exp(joint-scene['normalization_offset'])/scene['scaled_normalizer'],scene['posterior'][name])
              assert math.isclose(math.log(scene['priors'][name])+sum(math.log(v) for v in scene['likelihood_factors'][name].values()),joint)
          assert 'Decision calculation:' in packet['text'] and 'Scenario probabilities:' in packet['text']
          evidence=facts(records)
          answer={'environment':'outdoor','setting':'street','next_step':'check_signal:d1','reason':'In the estimated street setting, I recommend checking [d1] because its detected presence does not establish its current state.'}
          assert parse_choice(json.dumps(answer),action_choices(evidence),evidence)['reason']==answer['reason']
          for reason in ('A dog appears next to [d1] and needs attention.', 'I recommend checking [d99] before acting.', 'I see [d1] with 100% certainty.'):
              try:
                  parse_choice(json.dumps({**answer,'reason':reason}),action_choices(evidence),evidence)
                  raise AssertionError('Unsupported explanation accepted')
              except ValueError:
                  pass
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=[{'message':{'content':json.dumps({k:v for k,v in answer.items() if k!='reason'})}}, {'response':json.dumps({'reason':answer['reason']}),'eval_count':55,'prompt_eval_count':200}]):
              packet=measure_description(llm,frame,records)
              assert packet['reason_source']=='LLM' and 'I recommend checking' in packet['reason']
              assert all(label in packet['text'] for label in ('Environment (LLM):','Decision (LLM):','Description (LLM):'))
              assert packet['efficiency']['eval_count']==55 and packet['efficiency']['model_calls']==2
          # One rejected explanation can be corrected; all three calls are measured.
          first={'message':{'content':json.dumps({k:v for k,v in answer.items() if k!='reason'})},'eval_count':10}
          bad={'response':json.dumps({'reason':'[d1] is at a safe distance and requires no response.'}),'eval_count':20}
          good={'response':json.dumps({'reason':answer['reason']}),'eval_count':30}
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=[first,bad,good]) as requests:
              fixed=measure_description(llm,frame,records)
              assert fixed['grounding_status']=='validated' and fixed['efficiency']['model_calls']==3
              assert fixed['efficiency']['eval_count']==60
              assert requests.call_args_list[1].args[1]=='/api/generate'
              assert requests.call_args_list[1].args[2]['raw'] is True
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=[first,bad,bad]):
              assert llm.describe(frame,records)['grounding_status']=='fallback'
          assert expected_matches(packet,'Take Action','street')=={'decision_match':True,'setting_match':True}
          assert not expected_matches({**packet,'grounding_status':'fallback'},'Take Action','street')['decision_match']
          results=[]
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.OllamaVisionClient.describe',return_value=packet):
              run_comparison(RunConfig(),frame,records,2,lambda k,v:results.append(v) if k=='result' else None,threading.Event())
          assert len(results)==18 and len({r['algorithm'] for r in results})==9
          with tempfile.TemporaryDirectory() as directory:
              for ext in ('csv','json'):
                  path=Path(directory)/('comparison.'+ext)
                  export_results(path,results,'Take Action','street',{'frame':1})
                  assert path.stat().st_size>100
          # Comparison keeps both results and explanation controls visible at minimum size.
          from cnn_llm_based_descriptor.comparison import ComparisonWindow
          with patch.object(App,'refresh_devices'), patch.object(App,'refresh_cameras'):
              root=tk.Tk(); app=App(root); app.selected_device.set('CPU')
              app._preview({'rgb':frame,'comparison_bgr':frame,'original_size':[100,100],'task':'Object detection','confidence':.25,'inference':True,'records':records,'fps':1,'resolution':'100 x 100','count':3,'frame':1,'inference_ms':3})
              app.show_comparison(); comparison=app.comparison_window
              for size in ('1180x820','760x520'):
                  comparison.window.geometry(size);settle(root)
                  for widget in (comparison.run_button,comparison.cancel_button,comparison.export_button,comparison.table,comparison.detail):visible(widget,comparison.window)
                  assert comparison.detail.winfo_height()>=40
              comparison.results=results;comparison.refresh();settle(root)
              assert comparison.table.item('0','values')[6]=='Not applicable'
              comparison.decision.set('Take Action');comparison.refresh()
              assert comparison.table.item('0','values')[5]=='Match'
              comparison.close();app._destroy()
          # A trace cap never drops review targets or changes the cost solution.
          many=[record('custom gauge',.4,x=i%90) for i in range(60)]
          plan=create_descriptor_client(RunConfig(describe_backend='Search Algorithm')).describe(frame,many)['decision_search']
          assert len(plan['traversal'])==250 and plan['trace_omitted']==plan['expanded_states']-250
          assert len(plan['steps'])==60 and plan['omitted_targets']==0
          # Robot plan policy: independent examples, boundary counts, all-label coverage,
          # precedence, confidence gating, missing evidence, and real async/export paths.
          from cnn_llm_based_descriptor.algorithms.robot_plans.plans import PLANS
          from cnn_llm_based_descriptor.algorithms.robot_plans.client import GeneralAlgorithmicClient
          from cnn_llm_based_descriptor.algorithms.factory import create_descriptor_client
          from cnn_llm_based_descriptor.measurement import measure_description
          general_cfg=RunConfig(describe_backend='General Algorithmic Approach',describe_url='invalid',describe_max_objects=1)
          general_cfg.validate_descriptor()
          general=create_descriptor_client(general_cfg)
          assert isinstance(general,GeneralAlgorithmicClient)
          scenarios=[([], 'empty_area', 'No Action'),
                     (['person']*4,'people_nearby','Take Action'),
                     (['person']*5,'crowded_area','Take Action'),
                     (['person','car'],'people_and_vehicles','Take Action'),
                     (['traffic light'],'signal_review','Take Action'),
                     (['dog'],'animal_presence','Take Action'),
                     (['knife'],'tool_handling','Take Action'),
                     (['car'],'vehicle_presence','Take Action'),
                     (['cup']*3,'sparse_objects','No Action'),
                     (['cup']*4,'moderate_objects','No Action'),
                     (['cup']*9,'moderate_objects','No Action'),
                     (['cup']*10,'dense_objects','Take Action')]
          with patch('cnn_llm_based_descriptor.algorithms.llm.client.request_json',side_effect=AssertionError('Robot plans called an LLM')):
              for labels,plan_id,decision in scenarios:
                  packet=measure_description(general,frame,[record(label) for label in labels])
                  assert packet['action_plan']['selected_plan']['id']==plan_id, (labels,packet)
                  assert packet['action_decision']==decision
                  assert packet['grounding_status']=='validated'
                  assert packet['environment'] is None and packet['setting'] is None and 'Environment' not in packet['text']
                  assert packet['efficiency']['rules_evaluated']==12
                  assert packet['inference_latency_ms']>0 and packet['detections_considered']==len(labels)
                  assert expected_matches(packet,decision,'street')=={'decision_match':True,'setting_match':None}
              low=general.describe(frame,[record('person',.499)]*5)
              assert low['action_plan']['selected_plan']['id']=='uncertain_detections'
              assert low['action_plan']['counts']['people']==0
              assert general.describe(frame,[record('person',.5)]*5)['action_plan']['selected_plan']['id']=='crowded_area'
              mixture=general.describe(frame,[record('person')]*5+[record('car'),record('knife'),record('custom gauge',.3)])
              assert mixture['action_plan']['selected_plan']['id']=='crowded_area'
              assert {p['id'] for p in mixture['action_plan']['applicable_plans']} >= {'crowded_area','people_and_vehicles','tool_handling','uncertain_detections','vehicle_presence'}
              assert all(p['action_decision']=='Take Action' for p in mixture['action_plan']['applicable_plans'])
              assert all(p['name'] in mixture['suggested_action']['text'] for p in mixture['action_plan']['applicable_plans'])
              one_tool=general.describe(frame,[record('knife')])
              assert one_tool['action_decision']=='Take Action' and 'scissors' not in one_tool['suggested_action']['text']
              assert 'idle plan overridden' in one_tool['text']
              all_labels=general.describe(frame,[record(label) for label in model['labels']]+[record('custom gauge')])
              assert len(all_labels['action_plan']['assessments'])==81
              assert all_labels['action_plan']['counts']['strong']==81
              many=general.describe(frame,[record('custom gauge',x=i%90) for i in range(1000)])
              assert many['action_plan']['counts']['total']==1000 and len(many['action_plan']['selected_plan']['detection_ids'])==1000
              assert many['action_plan']['selected_plan']['id']=='dense_objects'
              bad=[record('person',float('nan')),record('person',.24),{'name':'person','confidence':.9},
                   {'name':'person','confidence':.9,'box':{'x1':1,'x2':1,'y1':1,'y2':5}}]
              assert general.describe(frame,bad)['action_plan']['selected_plan']['id']=='empty_area'
              filtered=create_descriptor_client(replace(general_cfg,confidence=.95)).describe(frame,[record('person')]*5)
              assert filtered['action_plan']['counts']['total']==0
              classified=create_descriptor_client(replace(general_cfg,task='Image classification')).describe(frame,[record('person')])
              assert classified['grounding_status']=='classification' and 'action_plan' not in classified
              # The plan evaluates detector evidence only; pixel content cannot change it.
              assert general.describe(frame,[record('dog')])['action_plan']==general.describe(np.full_like(frame,255),[record('dog')])['action_plan']
              with tempfile.TemporaryDirectory() as directory:
                  stop=threading.Event();switch=threading.Event();switch.set();messages=queue.Queue()
                  worker=FrameDescriber(general_cfg,messages,stop,switch)
                  assert worker.submit(frame,[record('person')]*5,7,None,time.monotonic(),directory)
                  packet=messages.get(timeout=5);worker.close()
                  saved=json.loads((Path(directory)/'descriptions.jsonl').read_text())
                  assert packet['type']=='description' and saved['action_plan']['selected_plan']['id']=='crowded_area'
                  assert saved['algorithm']=='Priority-Based Robot Action Plans' and saved['inference_latency_ms']>0
                  for ext in ('json','csv'):
                      path=Path(directory)/('plans.'+ext)
                      export_results(path,[saved],'Take Action','street',{'frame':7})
                      assert 'General Algorithmic Approach' in path.read_text()
                  assert 'Crowded-Area Robot Action Plan' in path.read_text()
          print('Robot plans: 12 rules, counts, confidence boundaries, precedence, all labels, 1000 objects, async saving and exports passed.')
          assert RunConfig().weights.parent.name == 'Models'
          print('Desktop, algorithm, grounding and latency checks passed.')
          PY
